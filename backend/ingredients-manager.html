<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredients Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .form-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
        }

        .form-section h2 {
            color: #495057;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,123,255,0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            color: #212529;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .ingredients-list {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .ingredients-list h2 {
            background: linear-gradient(135deg, #6c757d, #495057);
            color: white;
            padding: 20px;
            margin: 0;
        }

        .ingredient-item {
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
            transition: background-color 0.3s ease;
        }

        .ingredient-item:hover {
            background-color: #f8f9fa;
        }

        .ingredient-item:last-child {
            border-bottom: none;
        }

        .ingredient-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .ingredient-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #495057;
        }

        .ingredient-id {
            background: #e9ecef;
            color: #6c757d;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .ingredient-description {
            color: #6c757d;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .ingredient-actions {
            display: flex;
            gap: 10px;
        }

        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 500;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .content {
                padding: 20px;
            }
            
            .ingredient-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .ingredient-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Ingredients Manager</h1>
        </div>
        
        <div class="content">
            <!-- Alert Messages -->
            <div id="alertContainer"></div>
            
            <!-- Add/Edit Form -->
            <div class="form-section">
                <h2 id="formTitle">Add New Ingredient</h2>
                <form id="ingredientForm">
                    <input type="hidden" id="ingredientId">
                    
                    <div class="form-group">
                        <label for="ingredientName">Ingredient Name *</label>
                        <input type="text" id="ingredientName" name="name" required 
                               placeholder="e.g., Tomatoes, Olive Oil, Garlic">
                    </div>
                    
                    <div class="form-group">
                        <label for="ingredientDescription">Description</label>
                        <textarea id="ingredientDescription" name="description" 
                                  placeholder="Optional description of the ingredient..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        Add Ingredient
                    </button>
                    <button type="button" class="btn btn-warning" id="cancelBtn" style="display: none;">
                        Cancel Edit
                    </button>
                </form>
            </div>
            
            <!-- Ingredients List -->
            <div class="ingredients-list">
                <h2>All Ingredients</h2>
                <div id="ingredientsList">
                    <div class="loading">Loading ingredients...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3001';
        let currentEditId = null;

        // DOM Elements
        const form = document.getElementById('ingredientForm');
        const formTitle = document.getElementById('formTitle');
        const ingredientIdInput = document.getElementById('ingredientId');
        const nameInput = document.getElementById('ingredientName');
        const descriptionInput = document.getElementById('ingredientDescription');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const ingredientsList = document.getElementById('ingredientsList');
        const alertContainer = document.getElementById('alertContainer');

        // Load ingredients on page load
        document.addEventListener('DOMContentLoaded', loadIngredients);

        // Form submission
        form.addEventListener('submit', handleSubmit);

        // Cancel edit
        cancelBtn.addEventListener('click', cancelEdit);

        async function loadIngredients() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/ingredients`);
                const data = await response.json();
                
                if (data.success) {
                    displayIngredients(data.ingredients);
                } else {
                    showAlert('Failed to load ingredients', 'error');
                }
            } catch (error) {
                console.error('Error loading ingredients:', error);
                showAlert('Failed to connect to server', 'error');
            }
        }

        function displayIngredients(ingredients) {
            if (ingredients.length === 0) {
                ingredientsList.innerHTML = `
                    <div class="empty-state">
                        <h3>No ingredients yet</h3>
                        <p>Add your first ingredient using the form above!</p>
                    </div>
                `;
                return;
            }

            ingredientsList.innerHTML = ingredients.map(ingredient => `
                <div class="ingredient-item">
                    <div class="ingredient-header">
                        <span class="ingredient-name">${escapeHtml(ingredient.name)}</span>
                        <span class="ingredient-id">ID: ${ingredient.id}</span>
                    </div>
                    <div class="ingredient-description">
                        ${ingredient.description ? escapeHtml(ingredient.description) : '<em>No description</em>'}
                    </div>
                    <div class="ingredient-actions">
                        <button class="btn btn-warning" onclick="editIngredient(${ingredient.id}, '${escapeForJs(ingredient.name)}', '${escapeForJs(ingredient.description || '')}')">
                            Edit
                        </button>
                        <button class="btn btn-danger" onclick="deleteIngredient(${ingredient.id}, '${escapeForJs(ingredient.name)}')">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function handleSubmit(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            const data = {
                name: formData.get('name'),
                description: formData.get('description')
            };

            try {
                const url = currentEditId ? 
                    `${API_BASE_URL}/api/ingredients/${currentEditId}` : 
                    `${API_BASE_URL}/api/ingredients`;
                
                const method = currentEditId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (result.success) {
                    showAlert(result.message, 'success');
                    form.reset();
                    cancelEdit();
                    loadIngredients();
                } else {
                    showAlert(result.error, 'error');
                }
            } catch (error) {
                console.error('Error submitting form:', error);
                showAlert('Failed to save ingredient', 'error');
            }
        }

        function editIngredient(id, name, description) {
            currentEditId = id;
            formTitle.textContent = 'Edit Ingredient';
            ingredientIdInput.value = id;
            nameInput.value = name;
            descriptionInput.value = description;
            submitBtn.textContent = 'Update Ingredient';
            cancelBtn.style.display = 'inline-block';
            
            // Scroll to form
            document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
        }

        function cancelEdit() {
            currentEditId = null;
            formTitle.textContent = 'Add New Ingredient';
            ingredientIdInput.value = '';
            nameInput.value = '';
            descriptionInput.value = '';
            submitBtn.textContent = 'Add Ingredient';
            cancelBtn.style.display = 'none';
        }

        async function deleteIngredient(id, name) {
            if (!confirm(`Are you sure you want to delete "${name}"?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/ingredients/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                
                if (result.success) {
                    showAlert(result.message, 'success');
                    loadIngredients();
                } else {
                    showAlert(result.error, 'error');
                }
            } catch (error) {
                console.error('Error deleting ingredient:', error);
                showAlert('Failed to delete ingredient', 'error');
            }
        }

        function showAlert(message, type) {
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            const alert = document.createElement('div');
            alert.className = `alert ${alertClass}`;
            alert.textContent = message;
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alert);
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escapeForJs(text) {
            return text ? text.replace(/'/g, "\\'").replace(/"/g, '\\"') : '';
        }
    </script>
</body>
</html>
